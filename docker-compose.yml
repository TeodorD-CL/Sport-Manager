services:

  app:
    build:
      context: .
      args:
        COMPOSER_FLAGS: ""  # keep dev dependencies locally
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source so edits on the host are reflected immediately.
      # This hides the image's built assets: run `npm run dev` (or `npm run build`) on the host.
      - .:/app
      # Keep vendor from the image — don't let the (empty) host folder shadow it
      - vendor:/app/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - RUN_SCHEDULER=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=sport_manager
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sport_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sport_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vendor:
  pgdata:
